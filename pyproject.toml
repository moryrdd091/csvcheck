[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csvcheck"
version = "0.1.0.dev0"
description = "Contrôle local de fichiers CSV de contacts."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
csvcheck = "csvcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csvcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]